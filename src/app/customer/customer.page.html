<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title><div class="fontthai">ข้อมูลลูกค้า</div></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bg" [fullscreen]="true" >
  <ion-list >
    <ion-item>
      <ion-buttons slot="end">
        <ion-button size="20" routerLink="/home" >
          <ion-icon slot="icon-only" ios="home-outline" md="home-sharp"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-buttons slot="end">
        <ion-button routerLink="/addcustomer" >
          <ion-icon slot="icon-only" ios="add-outline" md="add-sharp"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
    <ion-item *ngFor="let item of customer " class="fontthai"> 
      <h5>รหัสลูกค้า : {{item.Customer_ID}}<br>
        รหัสบัตรประจำตัวประชาชน : {{item.ID_Card_No}}
        <br>ชื่อ : {{item.title_name}} {{item.First_Name}} {{item.Last_Name}} </h5>
    </ion-item>
  </ion-list>
</ion-content>
